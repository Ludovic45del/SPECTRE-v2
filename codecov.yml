codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 70%
        threshold: 1%
        if_ci_failed: error
      backend:
        target: 80%
        threshold: 1%
        flags:
          - backend-unit
          - backend-integration
      frontend:
        target: 70%
        threshold: 1%
        flags:
          - frontend
    patch:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

flags:
  backend-unit:
    paths:
      - backend/app/
    carryforward: false
  backend-integration:
    paths:
      - backend/app/
    carryforward: false
  frontend:
    paths:
      - frontend/src/
    carryforward: false

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "backend/app/tests/**"
  - "backend/app/**/migrations/**"
  - "frontend/src/**/*.test.ts"
  - "frontend/src/**/*.test.tsx"
  - "frontend/src/test/**"
  - "frontend/public/**"
