name: Quality — Type checking (mypy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (progressive)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install mypy==1.13.0 django-stubs[compatible-mypy]==5.1.1 djangorestframework-stubs==3.15.1

      # Soft baseline: warn-only on legacy code. Strict modules (declared in
      # mypy.ini overrides) are still enforced by mypy itself per its config.
      - name: Run mypy (soft baseline, warn-only)
        continue-on-error: true
        run: mypy app

      - name: Summarise mypy result
        if: always()
        run: |
          echo "::notice::mypy is currently advisory. Promote modules to the strict allowlist in backend/mypy.ini as you clean them up."
