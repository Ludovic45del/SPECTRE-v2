name: Performance — k6 load tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override target URL (default: backend booted in this runner)"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *" # Nightly 02:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a perf run mid-flight

jobs:
  loadtest:
    name: Smoke + moderate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spectre_loadtest
          POSTGRES_USER: spectre
          POSTGRES_PASSWORD: spectre_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spectre"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: loadtest-secret-not-for-production
      DEBUG: "false"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: spectre_loadtest
      DB_USER: spectre
      DB_PASSWORD: spectre_loadtest
      DB_HOST: localhost
      DB_PORT: "5432"
      K6_USER: loadtest@spectre.test
      K6_PASSWORD: loadtest-password-123

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Seed load-test user
        working-directory: backend
        run: python manage.py createadmin --email "$K6_USER" --password "$K6_PASSWORD"

      - name: Boot Django (background)
        if: ${{ inputs.base_url == '' }}
        working-directory: backend
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > /tmp/django.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/auth/token/ -X OPTIONS > /dev/null 2>&1; then
              echo "Django ready"
              break
            fi
            sleep 1
          done

      - name: Set up k6
        uses: grafana/setup-k6-action@98db1bcacc2d06234a3cade8629ebc97e0130ec2 # v1

      - name: Resolve target URL
        id: target
        run: |
          URL="${{ inputs.base_url }}"
          if [ -z "$URL" ]; then URL="http://127.0.0.1:8000"; fi
          echo "base_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Target: $URL"

      - name: Run smoke test
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: k6 run --summary-export=load-tests/results/smoke-summary.json load-tests/k6/smoke.js

      - name: Run moderate load test
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: k6 run --summary-export=load-tests/results/moderate-summary.json load-tests/k6/moderate.js

      - name: Upload Django log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: django-log
          path: /tmp/django.log
          retention-days: 7

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-results
          path: load-tests/results/
          retention-days: 30
