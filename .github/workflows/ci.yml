name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DJANGO_SECRET_KEY: 'ci-test-secret-key-not-for-production'
  DEBUG: 'true'

jobs:
  # ============================================
  # BACKEND JOBS
  # ============================================

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with Black
        run: black --check --diff .

      - name: Check imports with isort
        run: isort --check-only --diff .

      - name: Lint with Flake8
        run: flake8 app --max-line-length=120 --exclude=migrations

      - name: Audit Python dependencies for known CVEs (pip-audit)
        run: |
          pip install --upgrade pip-audit
          pip-audit --requirement requirements.txt --strict

  test-backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    env:
      # config/settings.py hard-requires DB_NAME at import time (prod safeguard).
      # Unit tests are declared "no DB" via the `unit` pytest marker, so we
      # point Django at an in-memory SQLite backend: settings load cleanly,
      # no Postgres service to boot, no real SQL ever executed.
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
      DB_USER: ""
      DB_PASSWORD: ""
      DB_HOST: ""
      DB_PORT: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest app/tests/unit -v -m unit \
            --cov=app/domain \
            --cov=app/mapper \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-backend-integration:
    name: Backend Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spectre_test
          POSTGRES_USER: spectre
          POSTGRES_PASSWORD: spectre_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spectre"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: spectre_test
      DB_USER: spectre
      DB_PASSWORD: spectre_ci
      DB_HOST: localhost
      DB_PORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django migrations
        run: python manage.py migrate --settings=config.settings

      - name: Run integration tests with coverage
        run: |
          pytest app/tests/integration -v -m integration \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: backend/coverage.xml
          flags: backend-integration
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-backend-service:
    name: Backend Service Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spectre_test
          POSTGRES_USER: spectre
          POSTGRES_PASSWORD: spectre_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spectre"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: spectre_test
      DB_USER: spectre
      DB_PASSWORD: spectre_ci
      DB_HOST: localhost
      DB_PORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations for service tests
        run: python manage.py migrate --settings=config.settings

      - name: Run service workflow tests
        run: |
          pytest app/tests/service -v -m service \
            --no-cov

  # ============================================
  # FRONTEND JOBS
  # ============================================

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Check formatting with Prettier
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Audit npm dependencies for known CVEs (high+)
        run: npm audit --audit-level=high

  test-frontend-unit:
    name: Frontend Unit & Component Tests
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ============================================
  # BUILD CHECK
  # ============================================

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
