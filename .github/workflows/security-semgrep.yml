name: Security — Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Semgrep
        run: pip install semgrep==1.96.0

      - name: Run Semgrep
        # Aggregates multiple rulesets relevant to the stack (Python/Django + JS/TS/React).
        # --sarif emits a SARIF file for GitHub Security tab integration.
        # --error makes the job fail on findings (informational only on PRs by default).
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/python \
            --config p/django \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --sarif --output=semgrep.sarif \
            --metrics=off

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@865f5f5c36632f18690a3d569fa0a764f2da0c3e # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
