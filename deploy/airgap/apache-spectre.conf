# =============================================================================
#  SPECTRE — vhost Apache (httpd) pour déploiement AIR-GAP sur RHEL 9
# =============================================================================
#  Installer dans : /etc/httpd/conf.d/spectre.conf
#
#  Rôle d'Apache :
#    • sert le frontend React (build statique) sur /
#    • sert les statiques Django (admin/DRF) sur /static/  (depuis STATIC_ROOT)
#    • sert les médias uploadés sur /api/media/            (depuis MEDIA_ROOT)
#    • reverse-proxy le reste de /api/ vers gunicorn (127.0.0.1:8000)
#
#  Authentification Kerberos/SSO : gérée par l'IT en amont (voir le bloc
#  <Location "/"> commenté en bas). Django ne gère PAS l'auth navigateur.
#
#  Modules requis (souvent déjà chargés sur RHEL 9) :
#    mod_proxy mod_proxy_http mod_headers mod_dir
#    → sudo dnf install -y mod_ssl  (si TLS) ; les mod_proxy* sont dans httpd.
#
#  ⚠ ADAPTER : ServerName + les 3 chemins /opt/spectre/... à votre installation.
# =============================================================================

<VirtualHost *:80>
    ServerName spectre.intra.cea.fr

    ErrorLog  /var/log/httpd/spectre_error.log
    CustomLog /var/log/httpd/spectre_access.log combined

    # ------------------------------------------------------------------ #
    #  Frontend React (build Vite → frontend/dist)
    # ------------------------------------------------------------------ #
    DocumentRoot "/opt/spectre/frontend/dist"
    <Directory "/opt/spectre/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Routage côté client (React Router) : toute URL non-fichier et non-/api
        # retombe sur index.html. /api/* est intercepté par ProxyPass en amont,
        # /static/ et /api/media/ par les Alias : ils n'atteignent pas ce fallback.
        FallbackResource /index.html
    </Directory>

    # ------------------------------------------------------------------ #
    #  Statiques Django (admin, DRF browsable API) — servis depuis le disque
    #  STATIC_ROOT après `collectstatic`. whitenoise reste actif côté gunicorn
    #  en secours, mais Apache les sert directement ici (plus rapide).
    # ------------------------------------------------------------------ #
    Alias /static/ "/opt/spectre/backend/staticfiles/"
    <Directory "/opt/spectre/backend/staticfiles">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ------------------------------------------------------------------ #
    #  Médias uploadés (photos FSEC/FA, avatars, signatures) — MEDIA_ROOT.
    #  Django ne sert MEDIA qu'en DEBUG : en prod c'est Apache qui l'expose.
    # ------------------------------------------------------------------ #
    Alias /api/media/ "/opt/spectre/backend/media/"
    <Directory "/opt/spectre/backend/media">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # ------------------------------------------------------------------ #
    #  Reverse proxy API → gunicorn
    #  L'exclusion /api/media/ DOIT précéder le ProxyPass /api/.
    # ------------------------------------------------------------------ #
    ProxyPreserveHost On
    ProxyPass         /api/media/ !
    ProxyPass         /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse  /api/ http://127.0.0.1:8000/api/

    # Scheme vu par Django (SECURE_PROXY_SSL_HEADER attend X-Forwarded-Proto).
    # Réseau interne HTTP : "http" + SECURE_SSL_REDIRECT=False dans le .env.
    # Si l'IT termine le TLS en amont, passer "https" ici.
    RequestHeader set X-Forwarded-Proto "http"

    # ------------------------------------------------------------------ #
    #  (Optionnel) Authentification Kerberos/SSO gérée par Apache (IT).
    #  Décommenter et adapter avec mod_auth_gssapi. Django fait confiance à
    #  l'utilisateur authentifié en amont.
    # ------------------------------------------------------------------ #
    # <Location "/">
    #     AuthType GSSAPI
    #     AuthName "SPECTRE CEA SSO"
    #     GssapiCredStore keytab:/etc/httpd/spectre.keytab
    #     Require valid-user
    # </Location>
</VirtualHost>
