# Contrôle d'accès par IP — désactivé par défaut.
#
# Pour ACTIVER la whitelist :
#   1. Commenter la ligne `allow all;` ci-dessous
#   2. Lister les IP autorisées :
#        allow 1.2.3.4;
#        allow 10.0.0.0/24;
#   3. Recharger nginx sans redémarrer le conteneur :
#        docker compose -f deploy/docker-compose.prod.yml exec nginx nginx -s reload
#
# Toute IP non listée recevra alors un 403 (cf. `deny all;` dans nginx.conf).

allow all;
