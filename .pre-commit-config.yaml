default_language_version:
  python: python3.11

repos:
  # Python formatting
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ['--line-length=120']
        files: ^backend/

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']
        files: ^backend/

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--exclude=migrations']
        files: ^backend/

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Frontend formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|json|css)$

  # Frontend linting (local hook)
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: npx --prefix frontend eslint --max-warnings=0
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: true

      - id: frontend-typecheck
        name: Frontend TypeScript Check
        # pass_filenames: false because tsc --noEmit does not accept individual
        # file arguments — it must type-check the entire project at once.
        entry: npx --prefix frontend tsc --noEmit
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
